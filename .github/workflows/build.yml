name: Build MixaPozioni

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: MixaPozioni-Windows
            path: dist/MixaPozioni.exe
          - os: macos-latest
            artifact: MixaPozioni-Mac
            path: dist/MixaPozioni-mac.zip
          - os: ubuntu-latest
            artifact: MixaPozioni-Linux
            path: dist/MixaPozioni
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installa dipendenze
        run: python -m pip install -r requirements-dev.txt
      - name: Test
        run: python -m pytest -q
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
      - name: Build (Windows / Linux, file unico)
        if: runner.os != 'macOS'
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name MixaPozioni main.py
      - name: Build (macOS, .app)
        if: runner.os == 'macOS'
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name MixaPozioni main.py
          # ditto conserva i permessi di esecuzione dentro l'.app (uno zip normale no)
          ditto -c -k --sequesterRsrc --keepParent dist/MixaPozioni.app dist/MixaPozioni-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  # Quando si crea un tag (es. v1.0.0) pubblica una Release con i file scaricabili
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Rinomina i file per il download
        run: |
          mkdir release
          cp artifacts/MixaPozioni-Windows/MixaPozioni.exe release/MixaPozioni-Windows.exe
          cp artifacts/MixaPozioni-Mac/MixaPozioni-mac.zip release/MixaPozioni-Mac.zip
          cp artifacts/MixaPozioni-Linux/MixaPozioni release/MixaPozioni-Linux
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
